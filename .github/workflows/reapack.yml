name: ReaPack Index

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint Lua Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua-check

      - name: Run Luacheck
        run: luacheck .

  index:
    name: Generate ReaPack Index
    needs: lint
    if: "github.ref == 'refs/heads/main' && github.event_name == 'push'"
    runs-on: ubuntu-latest
    concurrency:
      group: reapack-index
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install pandoc and reapack-index
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          gem install reapack-index

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build ReaPack Index
        run: |
          set -o pipefail
          reapack-index --rebuild --commit -m "chore: update index.xml [skip ci]" 2>&1 | tee "$RUNNER_TEMP/reapack-index.log"
          if grep -i "warning:" "$RUNNER_TEMP/reapack-index.log" | grep -i "conflict"; then
            echo "::error::reapack-index reported conflicts"
            exit 1
          fi

      - name: Push updated index
        run: |
          git pull --rebase origin main
          git push origin HEAD:main
