name: ReaPack Index

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint Lua Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua-check

      - name: Run Luacheck
        run: luacheck .

  index:
    name: Generate ReaPack Index
    needs: lint
    if: "github.ref == 'refs/heads/main' && github.event_name == 'push'"
    runs-on: ubuntu-latest
    concurrency:
      group: reapack-index
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install pandoc and reapack-index
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          gem install reapack-index

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build ReaPack Index
        run: |
          set -o pipefail
          reapack-index --rebuild --commit -m "chore: update index.xml [skip ci]" 2>&1 | tee "$RUNNER_TEMP/reapack-index.log"

      - name: Verify every script is indexed at its current version
        run: |
          python3 - <<'PY'
          import os, re, sys, xml.etree.ElementTree as ET
          idx = ET.parse("index.xml").getroot()
          indexed = {}
          for cat in idx.iter("category"):
              for pkg in cat.iter("reapack"):
                  key = cat.get("name") + "/" + pkg.get("name")
                  indexed[key] = {v.get("name") for v in pkg.iter("version")}
          missing = []
          for root, _, files in os.walk("."):
              if "/." in root:
                  continue
              for f in files:
                  if not f.endswith(".lua"):
                      continue
                  path = os.path.join(root, f)[2:]
                  head = open(path, encoding="utf-8", errors="replace").read(4000)
                  if "@noindex" in head:
                      continue
                  m = re.search(r"^--\s*@version\s+(\S+)", head, re.M)
                  if not m:
                      continue
                  if m.group(1) not in indexed.get(path, set()):
                      missing.append(f"{path} {m.group(1)}")
          if missing:
              print("::error::Not in index.xml (check reapack-index warnings above):")
              print("\n".join(missing))
              sys.exit(1)
          print(f"OK: {len(indexed)} packages indexed")
          PY

      - name: Push updated index
        run: |
          git pull --rebase origin main
          git push origin HEAD:main
